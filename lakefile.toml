name = "compcert4lean"
git = "https://github.com/kim-em/compcert4lean.git"
rev = "cc4fe9256c0a5e6fe3290d1ee56ae5c5acfdec9d"  # branch nauty-verified

[[require]]
name = "hex-graph-iso"
git = "https://github.com/leanprover/hex-graph-iso.git"
